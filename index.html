<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>미미 의료기록</title>
<style>
:root {
  --bg-color:#f8fafc; --card-bg:#fff; --text-main:#0f172a; --text-muted:#64748b;
  --primary:#2563eb; --primary-hover:#1d4ed8; --border:#e2e8f0; --group-border:#64748b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg-color);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.header{background:#0f172a;color:#fff;padding:14px 20px;position:sticky;top:0;z-index:10;box-shadow:0 4px 12px #00000010}
.header-inner{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.title{font-size:18px;font-weight:800;letter-spacing:-.5px}
.container{max-width:1400px;margin:16px auto;padding:0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.btn{border:1px solid var(--border);border-radius:8px;padding:8px 12px;background:#fff;color:var(--text-main);font-weight:600;font-size:13px;cursor:pointer;transition:all .15s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.btn:active{background:#f1f5f9;border-color:#cbd5e1}
.btn.primary{background:var(--primary);color:#fff;border:none}.btn.primary:active{background:var(--primary-hover)}
.btn.danger{background:#ef4444;color:#fff;border:none}.btn.danger:active{background:#dc2626}
input,select,textarea{font:inherit;border:1px solid var(--border);border-radius:6px;padding:8px 10px;background:#fff;outline:none;transition:border-color .15s;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.group-section{margin-bottom:14px}
.group-title{font-size:14px;font-weight:700;color:var(--text-muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;border-left:3px solid var(--primary);padding-left:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{background:var(--card-bg);border-radius:10px;padding:10px 12px;box-shadow:0 1px 2px #0000000d;border:1px solid var(--border)}
.metric{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;padding:7px 8px;border-radius:8px}
.metric:active{transform:scale(.98)}
.metric-line{display:flex;align-items:center;justify-content:space-between;gap:5px;white-space:nowrap;overflow:hidden}
.metric-name{font-size:10px;color:var(--text-muted);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.metric-value{font-size:14px;font-weight:800;letter-spacing:-.4px}
.metric-status{font-size:9px;font-weight:800;flex-shrink:0}
.section{margin-top:20px}.section-title{font-size:15px;font-weight:700;margin-bottom:10px;letter-spacing:-.3px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tab{border:1px solid var(--border);background:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:34px}
.tab.active{background:#0f172a;color:#fff;border-color:#0f172a}
.chart-wrap{height:260px;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow:hidden}
.chart-wrap canvas{width:100%;height:100%;display:block;cursor:grab}
.chart-wrap canvas.dragging{cursor:grabbing}
.chart-tooltip{position:absolute;display:none;background:#0f172a;color:#fff;padding:8px 12px;border-radius:8px;font-size:11px;z-index:20;pointer-events:none;box-shadow:0 10px 15px -3px rgba(0,0,0,.3);max-width:220px;white-space:normal;line-height:1.4}
.sync-controller{background:#f1f5f9;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:14px 0;display:flex;align-items:center;gap:10px}
.sync-controller label{font-size:12px;font-weight:700;color:var(--text-main);white-space:nowrap}.sync-controller input[type=range]{flex:1;cursor:pointer}
.table-container{overflow:auto;-webkit-overflow-scrolling:touch;max-height:600px}
table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:11px}
th,td{padding:8px 6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;background:#fff}
th{background:#f8fafc;color:var(--text-muted);font-weight:600;border-top:1px solid var(--border)}
th.group-header{background:#f1f5f9;color:var(--text-main);font-weight:700;font-size:12px}
th:first-child,td:first-child{border-left:1px solid var(--border)}
.col-border{border-right:2px solid var(--group-border)!important}
.sticky-date{position:sticky!important;left:0;z-index:5;background:#fff!important;box-shadow:3px 0 5px rgba(15,23,42,.08)}
thead .sticky-date{z-index:7;background:#f8fafc!important}
thead tr:first-child .sticky-date{background:#f1f5f9!important}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--border);border-radius:10px;overflow:hidden;table-layout:fixed}
.weekday{padding:6px;background:#f8fafc;font-size:10px;font-weight:700;text-align:center;color:var(--text-muted);border-bottom:1px solid var(--border)}
.cal-day{height:75px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;background:#fff;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.cal-day:nth-child(7n){border-right:0}.cal-day.other{background:#fafafa;color:#cbd5e1}.cal-num{font-weight:700;font-size:10px}
.record{font-size:9px;margin-top:2px;padding:2px 4px;border-radius:4px;background:#eff6ff;color:#1d4ed8;font-weight:600;border-left:2px solid var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.event{background:#f3e8ff;color:#6b21a8;border-left-color:#9333ea}
.empty{text-align:center;padding:24px;color:var(--text-muted);font-size:12px}
.modal{position:fixed;inset:0;background:#00000066;backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:30;padding:12px}
.modal-box{background:#fff;border-radius:14px;padding:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 25px -5px #00000010}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.form-grid label{font-size:11px;font-weight:600;color:var(--text-muted)}.form-grid input{width:100%;margin-top:2px}
.alert{padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:6px;display:flex;align-items:center;gap:6px}.alert.danger{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}.alert.warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}.alert.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
#syncBadge{font-size:10px;padding:3px 6px;border-radius:10px;background:#e2e8f0;color:#475569;font-weight:600}#syncBadge.online{background:#dcfce7;color:#166534}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,1fr);gap:5px}.metric{padding:5px 6px}.metric-name{font-size:9px}.metric-value{font-size:13px}.metric-status{font-size:8px}.card{padding:8px 9px}.form-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="title" style="display:flex;align-items:center;gap:6px">🐩 미미 의료기록 <span id="syncBadge">연동 중...</span></div><button class="btn" onclick="openEvent()">＋ 이벤트</button></div></header>

<main class="container">
